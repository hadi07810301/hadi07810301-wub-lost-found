<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post an item · WUB Lost __TITLE__amp; Found</title>
<meta name="description" content="Lost and found board for World University of Bangladesh students. Post lost or found items on campus and help them get back to their owners.">
<meta name="theme-color" content="#0f4c5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f4a261'/%3E%3Ccircle cx='14.5' cy='14.5' r='7' fill='none' stroke='%230b3a46' stroke-width='3'/%3E%3Cpath d='m20 20 5 5' stroke='%230b3a46' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <div class="page-head"><div class="wrap"><h1 id="pTitle">Post an item</h1><p>Fill in what you can. Clear details and a photo make a match much more likely.</p></div></div>
  <div class="wrap">
    <form class="panel form-wrap" id="form" novalidate>
      <div class="seg" role="radiogroup" aria-label="Lost or found">
        <label class="lost"><input type="radio" name="type" value="lost"><span class="em">😟</span><span>I lost something<small>Ask people to look out for it</small></span></label>
        <label class="found"><input type="radio" name="type" value="found"><span class="em">🙌</span><span>I found something<small>Help it get back to the owner</small></span></label>
      </div>
      <div class="tip" id="tip">Choose whether you lost or found the item.</div>

      <fieldset>
        <legend>About the item</legend>
        <div class="fld"><label for="title">What is it? *</label><input id="title" maxlength="80" placeholder="e.g. Black Samsung phone with cracked cover"></div>
        <div class="row2">
          <div class="fld"><label for="category">Category *</label><select id="category"><option value="">— Select —</option></select></div>
          <div class="fld"><label for="date">Date *</label><input id="date" type="date"></div>
        </div>
        <div class="row2">
          <div class="fld"><label for="location">Where on campus? *</label><select id="location"><option value="">— Select —</option></select></div>
          <div class="fld"><label for="place">Exact spot</label><input id="place" maxlength="60" placeholder="e.g. Room 504, 3rd floor"></div>
        </div>
        <div class="fld"><label for="desc">Description</label><textarea id="desc" rows="4" maxlength="600" placeholder="Colour, brand, marks, stickers, what was inside…"></textarea>
          <div class="hint" id="descHint"></div></div>
        <div class="fld"><span class="lbl">Photo (optional)</span>
          <div class="drop" id="drop"><span id="dropTxt">📷 Tap to add a photo</span><input type="file" id="photo" accept="image/*" aria-label="Add a photo"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Your contact details</legend>
        <div class="row2">
          <div class="fld"><label for="contactName">Your name *</label><input id="contactName" maxlength="50"></div>
          <div class="fld"><label for="dept">Department</label><select id="dept"><option value="">— Select —</option></select></div>
        </div>
        <div class="fld"><label for="contact">How can people reach you? *</label><input id="contact" maxlength="80" placeholder="Phone, WhatsApp, email or Facebook">
          <div class="hint">This is shown publicly on your post so the owner or finder can contact you.</div></div>
      </fieldset>

      <div class="form-foot"><span class="err" id="err" role="alert"></span><a class="btn btn-ghost" href="browse.html">Cancel</a><button class="btn btn-dark" id="submit" type="submit">Post it</button></div>
    </form>
  </div>
</main>

<script type="module">
import { layout, store, CATS, LOCS, DEPTS, opt, el, param, todayLocal, toast, $ } from "./assets/app.js";
layout("post.html");
CATS.forEach(c => $("#category").append(opt(c[0], c[1] + " " + c[2])));
LOCS.forEach(l => $("#location").append(opt(l, l)));
DEPTS.forEach(d => $("#dept").append(opt(d, d)));
$("#date").value = todayLocal(); $("#date").max = todayLocal();
try { const s = JSON.parse(localStorage.getItem("wublf-me") || "{}"); if (s.n) $("#contactName").value = s.n; if (s.c) $("#contact").value = s.c; if (s.d) $("#dept").value = s.d; } catch (e) {}

function setType(t) {
  document.querySelectorAll("input[name=type]").forEach(r => r.checked = r.value === t);
  $("#tip").textContent = t === "found"
    ? "Tip: for ID cards, wallets and phones, don't post every detail (like the ID number or what's inside). Ask the person who contacts you to describe it, so you know it's really theirs."
    : "Tip: describe it clearly and add a photo if you have one. Also check the found items: someone may have already posted it.";
  $("#descHint").textContent = t === "found" ? "Keep one identifying detail secret to check the real owner." : "";
  $("#pTitle").textContent = t === "found" ? "Report a found item" : "Report a lost item";
}
document.querySelectorAll("input[name=type]").forEach(r => r.addEventListener("change", () => setType(r.value)));
const t0 = param("type"); if (t0 === "lost" || t0 === "found") setType(t0);

let photo = null;
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      res(cv.toDataURL("image/jpeg", q));
    };
    img.onerror = rej; img.src = url;
  });
}
$("#photo").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  if (!file.type.startsWith("image/")) { toast("Please choose an image."); return; }
  try {
    let d = await shrink(file, 900, 0.75);
    if (d.length > 300000) d = await shrink(file, 640, 0.65);
    photo = d;
    const drop = $("#drop"); drop.querySelector("img")?.remove();
    drop.prepend(el("img", { src: d, alt: "Photo preview" })); $("#dropTxt").textContent = "Tap to change photo";
  } catch (err) { toast("Couldn't read that image."); }
});

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const v = id => ($("#" + id).value || "").trim();
  const type = document.querySelector("input[name=type]:checked")?.value;
  if (!type) { $("#err").textContent = "Choose whether you lost or found it."; return; }
  const need = [["title", "what the item is"], ["category", "a category"], ["date", "the date"], ["location", "where on campus"], ["contactName", "your name"], ["contact", "how to reach you"]];
  for (const [id, label] of need) if (!v(id)) { $("#err").textContent = "Please add " + label + "."; $("#" + id).focus(); return; }
  const btn = $("#submit"); btn.disabled = true; btn.textContent = "Posting…"; $("#err").textContent = "";
  const data = { type, title: v("title"), category: v("category"), date: v("date"), location: v("location"), place: v("place"),
    desc: v("desc"), contactName: v("contactName"), contact: v("contact"), dept: v("dept"), photo: photo || null };
  try {
    localStorage.setItem("wublf-me", JSON.stringify({ n: data.contactName, c: data.contact, d: data.dept }));
  } catch (e) {}
  try {
    const id = await store.add(data);
    location.href = "item.html?id=" + encodeURIComponent(id) + "&new=1";
  } catch (err) {
    console.error(err);
    $("#err").textContent = err.message && err.message.includes("storage") ? err.message : "Couldn't post right now. Please try again.";
    btn.disabled = false; btn.textContent = "Post it";
  }
});
</script>
</body>
</html>
